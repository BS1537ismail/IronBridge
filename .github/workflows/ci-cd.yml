name: CI/CD Pipeline

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore IronBridge/IronBridge.csproj
      
    - name: Build
      run: dotnet build IronBridge/IronBridge.csproj --no-restore --configuration Release
      
    - name: Test
      run: dotnet test IronBridge/IronBridge.csproj --no-build --configuration Release --verbosity normal
      
    - name: Build Docker image
      run: docker build -t ironbridge:${{ github.sha }} .
      
  deploy-to-master:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Configure Git
      run: |
        git config --global user.email "md.ismail@brainstation-23.com"
        git config --global user.name "BS1537ismail"
        
    - name: Merge to master
      run: |
        git fetch origin
        git checkout -B master origin/master
        git merge origin/development --no-ff -m "Auto-merge from development to master [skip ci]"
        git push origin master