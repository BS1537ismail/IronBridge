version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - ironbridge-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  userauth-service:
    build:
      context: .
      dockerfile: Services/UserAuth.Service/Dockerfile
    container_name: userauth-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=UserAuthDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - ironbridge-network
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: Services/Product.Service/Dockerfile
    container_name: product-service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ProductDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - ironbridge-network
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: Services/Booking.Service/Dockerfile
    container_name: booking-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=BookingDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - Services__ProductService=http://product-service:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - ironbridge-network
    restart: unless-stopped

  admin-service:
    build:
      context: .
      dockerfile: Services/Admin.Service/Dockerfile
    container_name: admin-service
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AdminDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - Services__UserAuthService=http://userauth-service:8080
      - Services__ProductService=http://product-service:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      userauth-service:
        condition: service_started
      product-service:
        condition: service_started
    networks:
      - ironbridge-network
    restart: unless-stopped

networks:
  ironbridge-network:
    driver: bridge

volumes:
  sqlserver_data:
