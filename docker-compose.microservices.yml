version: '3.8'

services:
  userauth-service:
    build:
      context: ./Services/UserAuth.Service
      dockerfile: Dockerfile
    container_name: userauth-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal\\SQLEXPRESS;Database=UserAuthDb;Trusted_Connection=True;TrustServerCertificate=True;
    networks:
      - ironbridge-network
    restart: unless-stopped

  product-service:
    build:
      context: ./Services/Product.Service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal\\SQLEXPRESS;Database=ProductDb;Trusted_Connection=True;TrustServerCertificate=True;
    networks:
      - ironbridge-network
    restart: unless-stopped

  booking-service:
    build:
      context: ./Services/Booking.Service
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal\\SQLEXPRESS;Database=BookingDb;Trusted_Connection=True;TrustServerCertificate=True;
      - Services__ProductService=http://product-service:8080
    depends_on:
      - product-service
    networks:
      - ironbridge-network
    restart: unless-stopped

  admin-service:
    build:
      context: ./Services/Admin.Service
      dockerfile: Dockerfile
    container_name: admin-service
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Services__UserAuthService=http://userauth-service:8080
      - Services__ProductService=http://product-service:8080
    depends_on:
      - userauth-service
      - product-service
    networks:
      - ironbridge-network
    restart: unless-stopped

networks:
  ironbridge-network:
    driver: bridge
